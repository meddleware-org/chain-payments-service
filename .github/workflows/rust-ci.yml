name: Rust CI

# fmt, clippy, tests (real PostgreSQL over TLS: scripts/test-postgres.sh; the Move package's quote vectors; a recorded
# testnet transaction), coverage, cargo-deny, the SBOM gate, MSRV, and the image (configuration scan, licence notices,
# build, vulnerability scan, smoke test). The live testnet end-to-end run (scripts/e2e-testnet.sh) needs a funded key and
# is a release-time check, not CI.

# Every push to main and every pull request; the release workflow calls this one on the tagged commit.
on:
  push:
    branches: ["main"]
  pull_request:
  # The release workflow reuses this one on the tagged commit.
  workflow_call:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

env:
  # No tool in the pipeline may send telemetry.
  DO_NOT_TRACK: "1"

jobs:
  # The main gate: format, lints, tests against a real database, coverage, dependency policy and the SBOM check.
  check:
    name: fmt, clippy, test (PostgreSQL), coverage, cargo-deny, SBOM gate
    runs-on: ubuntu-latest
    steps:
      # The commit under test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stable toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy,llvm-tools --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The signed-message vectors are shared with the Move package, so both sides stay byte-for-byte equal.
      - name: Quote vectors match chain-payments-sui
        # fixtures/quote-vectors.json is a copy of the Move package's tests/vectors.json at this commit. A change on
        # either side fails here until both are updated together (and this pin moved).
        env:
          VECTORS_COMMIT: e1d099d317ed143ab0f0230a35727ca6b9823df1
        run: |
          curl -fsSL "https://raw.githubusercontent.com/meddleware-org/chain-payments-sui/${VECTORS_COMMIT}/tests/vectors.json" -o /tmp/move-vectors.json
          cmp /tmp/move-vectors.json fixtures/quote-vectors.json
      # Formatting is not negotiable in review: the check fails on any difference.
      - name: Format check
        run: cargo fmt --check

      # Warnings are errors, and the workspace lints (missing docs, no unsafe code) are part of the gate.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # A throwaway database with TLS, so the tests exercise the same verify-full path as production.
      - name: Start PostgreSQL (TLS)
        run: bash scripts/test-postgres.sh start

      # Nothing may be ignored or skipped.
      - name: Test
        run: |
          set -o pipefail
          cargo test --workspace --locked 2>&1 | tee test.log
          if grep -E '[1-9][0-9]* ignored' test.log; then echo "::error::a test was ignored"; exit 1; fi
          if grep -E 'SKIPPED' test.log; then echo "::error::a database test was skipped"; exit 1; fi
          echo "tests run: $(grep -E '^test result' test.log | awk '{ n += $4 } END { print n }')"

      - name: Install cargo-llvm-cov and cargo-cyclonedx
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-llvm-cov@0.9.1,cargo-cyclonedx@0.5.9

      # The line coverage is printed to the job summary: informational, not a gate.
      - name: Coverage
        run: |
          cargo llvm-cov --workspace --locked --summary-only | tee coverage.txt
          { echo '### Line coverage'; echo '```'; tail -n 3 coverage.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # Advisories, licences, bans and sources per deny.toml.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

      # The release attests a CycloneDX SBOM per binary; this is the gate it must pass there too.
      - name: SBOM gate
        run: |
          bash scripts/tests/check-sbom-test.sh
          cargo cyclonedx --manifest-path crates/cli/Cargo.toml --format json --spec-version 1.5 \
            --no-build-deps --target x86_64-unknown-linux-gnu -q
          bash scripts/check-sbom.sh crates/cli/chain-payments.cdx.json chain-payments

      # The gate the release uses to merge the two architecture images is tested here.
      - name: Index gate tests
        run: bash scripts/tests/check-index-test.sh

      # Always stop it, even when a step failed, so the runner is left clean.
      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/test-postgres.sh stop

  # The declared minimum Rust version must still build and pass the tests, so `rust-version` is a fact, not a hope.
  msrv:
    name: MSRV (rust-version in Cargo.toml)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The oldest compiler the manifest promises to support.
      - name: Install the declared minimum toolchain
        run: rustup toolchain install 1.94 --profile minimal --no-self-update && rustup default 1.94
      - name: Start PostgreSQL (TLS)
        run: bash scripts/test-postgres.sh start
      - name: Test on the declared minimum toolchain
        run: cargo test --locked --workspace
      - name: Stop PostgreSQL
        if: always()
        run: bash scripts/test-postgres.sh stop

  # The release image: scanned configuration, licence notices, the build, a vulnerability scan and a smoke test.
  image:
    name: Image (configuration scan, licence notices, build, scan, smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Trivy configuration scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          scanners: misconfig,secret
          severity: CRITICAL,HIGH
          exit-code: "1"
          version: v0.74.0

      # Fails when a linked crate's licence is not accepted by about.toml.
      - name: Third-party licence notices
        run: |
          docker build --target notices --tag chain-payments-service:notices .
          docker run --rm chain-payments-service:notices cat /out/THIRD_PARTY_LICENSES.txt > THIRD_PARTY_LICENSES.txt
          test -s THIRD_PARTY_LICENSES.txt

      # The Dockerfile as the release builds it, tagged locally only.
      - name: Build (not pushed)
        run: docker build --tag chain-payments-service:ci .

      - name: Scan the image (fail on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: chain-payments-service:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          version: v0.74.0

      # scripts/smoke.sh runs migrate, serve and worker as separate containers, as the cluster does.
      - name: Smoke test (migrate, serve and worker against PostgreSQL)
        run: bash scripts/smoke.sh chain-payments-service:ci
