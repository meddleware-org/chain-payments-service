[workspace]
resolver = "3"
members = ["crates/core", "crates/chain-sui", "crates/store", "crates/service", "crates/cli"]

[workspace.package]
version = "0.0.5"
edition = "2024"
rust-version = "1.94"
license = "0BSD"
repository = "https://github.com/meddleware-org/chain-payments-service"
publish = false

# Exact pins, as in the rest of the fleet.
[workspace.dependencies]
chain-payments-core = { path = "crates/core" }
chain-payments-chain-sui = { path = "crates/chain-sui" }
chain-payments-store = { path = "crates/store" }
chain-payments-service = { path = "crates/service" }

access-gate-gateway-core = "=0.0.33"
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring-webpki", "macros", "migrate", "json", "time", "uuid"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "tower-log"] }
tower = { version = "=0.5.3", default-features = false, features = ["util", "limit", "timeout"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["timeout", "limit"] }
tokio = { version = "=1.54.1", default-features = false }
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "env", "help", "usage", "error-context"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
anyhow = "=1.0.104"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "env-filter", "ansi"] }
url = "=2.5.8"
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting", "parsing"] }
uuid = { version = "=1.29.2", default-features = false, features = ["std", "v4", "serde"] }
base64 = "=0.23.1"
hex = "=0.4.3"
sha2 = "=0.11.1"
ring = "=0.17.14"
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "json", "http2"] }
proptest = "=1.12.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
overflow-checks = true
panic = "abort"
lto = true
codegen-units = 1
strip = true
