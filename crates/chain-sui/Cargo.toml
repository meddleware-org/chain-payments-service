# The Sui module: verifies a payment by its transaction digest over gRPC-web, and reads the `Paid` events through GraphQL.
[package]
name = "chain-payments-chain-sui"
description = "Chain Payments: the Sui module (verifies a payment by its transaction digest over gRPC-web; reads the Paid event)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Runtime dependencies, each declared once in the workspace.
[dependencies]
# The shared gRPC-web client and protobuf reader.
access-gate-gateway-core.workspace = true
# The HTTP transport for gRPC-web and the GraphQL read.
reqwest.workspace = true
rustls.workspace = true
tokio = { workspace = true, features = ["time"] }
anyhow.workspace = true
# Event fields are base64 in the node JSON.
base64.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# Used by the tests only.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }

# Use the workspace lint set (unsafe code is forbidden and missing docs are denied).
[lints]
workspace = true
