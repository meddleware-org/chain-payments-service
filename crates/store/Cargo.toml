# The database layer: every SQL statement, the migrations and the connection settings (verified TLS).
[package]
name = "chain-payments-store"
description = "Chain Payments: every SQL statement, the migrations and the connection settings (PostgreSQL, verify-full TLS)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Runtime dependencies, each declared once in the workspace.
[dependencies]
# The database client.
sqlx.workspace = true
# Parsing the database URL.
url.workspace = true
uuid.workspace = true
time.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# SHA-256 of API keys.
sha2.workspace = true
hex.workspace = true

# Used by the tests only.
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

# Use the workspace lint set (unsafe code is forbidden and missing docs are denied).
[lints]
workspace = true
